<div class="bg-color w-100 h-100">
  <div class="row m-0 vh-100">
    <div class="col-md-6 p-0 bg-black">
      <img src="assets/img/login.png" class="img-fluid h-100 w-100 object-fit-cover" alt="Login" />
    </div>
    <div class="col-md d-flex justify-content-center align-items-center bg-white">
      <div class="logcont-1 bg-white d-flex flex-column pt-5">
        <img *ngIf="!isNewPort" src="assets/img/header.svg" width="250" class="align-self-center" alt="Logo" />
         <img *ngIf="isNewPort" src="assets/img/header_newport.png" class="align-self-center" style="width: 350px;" alt="Newport" />
        <div class=" border rounded-4 p-5 mt-3 ">
          <p class="fs-20 pt-2 align-self-center text-center"> Two step authentication </p>
          <p class="fs-15 d-flex">
            <i class="fa fa-envelope text-danger fs-3" aria-hidden="true"></i>
            <span class="ps-2"> An email with a verification code was just sent to <br> <b>{{emailID}}</b></span>
          </p>
          <form #otploginForm="ngForm" class="row " (ngSubmit)="otploginSubmit()">
            <div class="col-md-12 mt-3">
              <label class="form-label fs-13">Enter Verification Code</label>
              <input type="text" id="OTPCode" name="OTPCode" required [(ngModel)]="OTPCode" pattern="[0-9]{6}" autocomplete="off" class="form-control p-3 br-clr1 text-center fs-13" placeholder="Enter the 6-digit code">
              <label class="form-label fs-13 mt-2">{{ remainingTime }} Seconds Left....</label>
              <p class="fs-13 mt-2 text-end">
                <a href="javascript:void(0)" (click)="resendOTP()" class="link-clr fs-13" [class.disabled-link]="resendDisabled">
                  <i class="fa fa-repeat" aria-hidden="true"></i>
                   Resend again
                </a>
              </p>
            </div>
            <div class="text-center">
              <button class="btn btn-primary bt-bg-color px-5 py-2 border-0 br-30 fs-13 pt-2 pb-2" type="submit" [disabled]="!(otploginForm.valid)"> Verify </button>
            </div>
          </form>
           <small *ngIf="loginErr !== ''" id="emailHelp" class="form-text text-muted">
              <span [textContent]='loginErr' style="color: red"></span>
            </small>
        </div>
      </div>

    </div>
  </div>
</div>
