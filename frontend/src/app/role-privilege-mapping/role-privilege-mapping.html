<div class="permissions-container fs-14">

  <div class="d-flex align-items-center gap-3 mb-3">

    <!-- Project Dropdown -->
    <div class="d-flex align-items-center gap-2">
      <label class="form-label fs-14 fw-semibold mb-0" style="font-size:14px; width=45%">AI Solution</label>
      <select class="form-select fs-14" [(ngModel)]="selectedProject" (change)="onProjectChange()">
        <option value="" disabled selected>Select AI Solution</option>
        <option *ngFor="let project of projects" [ngValue]="project">
          {{ project.projectName }}
        </option>
      </select>
    </div>

    <!-- Team Dropdown -->
    <div class="d-flex align-items-center gap-2">
      <label class="form-label fs-14 fw-semibold mb-0" style="font-size:14px;">Team</label>
      <select class="form-select fs-14" [(ngModel)]="selectedTeam" (change)="onTeamChange()" [disabled]="!selectedProject">
        <option value="" disabled selected>Select Team</option>
        <option *ngFor="let team of filteredTeams" [ngValue]="team">
          {{ team.teamName }}
        </option>
      </select>
    </div>

    <!-- Role Dropdown -->
    <div class="d-flex align-items-center gap-2">
      <label class="form-label fs-14 fw-semibold mb-0" style="font-size:14px;">Role</label>
      <select class="form-select fs-14" [(ngModel)]="selectedRole" (change)="onRoleChange()" [disabled]="!selectedTeam">
        <option value="" disabled selected>Select Role</option>
        <option *ngFor="let role of roles" [ngValue]="role">
          {{ role.role }}
        </option>
      </select>
    </div>

  </div>

  <!-- Custom buttons for quick actions-->
  <div>
    <div class="d-flex gap-3 mb-3 justify-content-end">
      <div class="form-check">
        <input class="form-check-input" type="radio" name="actionType" id="view" value="view" [(ngModel)]="selectedAction" (change)="selectPrivilegesBasedOnAction()">
        <label class="form-check-label" for="view">View Only</label>
      </div>
      <div class="form-check">
        <input class="form-check-input" type="radio" name="actionType" id="all" value="all" [(ngModel)]="selectedAction" (change)="selectPrivilegesBasedOnAction()">
        <label class="form-check-label" for="all">All</label>
      </div>
      <div class="form-check">
        <input class="form-check-input" type="radio" name="actionType" id="reset" value="reset" [(ngModel)]="selectedAction" (change)="selectPrivilegesBasedOnAction()">
        <label class="form-check-label" for="reset">Reset</label>
      </div>
    </div>
  </div>

  <!-- Permissions Table (Always shown, even if no role is selected) -->
  <table aria-label="Roles">
    <caption class="visually-hidden">Roles</caption>
    <thead>
      <tr>
        <th scope="col">Module</th>
        <th scope="col">Page</th>
        <th *ngFor="let action of actions">{{ action | titlecase }}</th>
      </tr>
    </thead>
    <tbody>
      <ng-container *ngFor="let group of groupedPages">
        <tr *ngFor="let page of group.pages; let i = index">
          <td *ngIf="i === 0" [attr.rowspan]="group.pages.length">{{ group.module | titlecase }}
            <input type="checkbox" class="ms-2" [checked]="isModuleFullySelected(group)" (change)="toggleModulePermissions(group)"  />
          </td>
          <td>{{ page.page | titlecase }}</td>
          <td *ngFor="let action of actions">
            <input type="checkbox" [checked]="permissions[page.page]?.[action]"
              (change)="togglePermission(page.page, action)"
              [disabled]="!isPageEditable(page, action)" />
          </td>
        </tr>
      </ng-container>
    </tbody>
  </table>

  <div class="modal-footer p-2 border-top mt-3">
    <button class="btn bg-orange text-white fs-12" [disabled]="!hasPermissionSelected" (click)="savePrivilegeDetails()">
      Save Permissions </button>
  </div>
</div>

<!-- Modal final message -->
<div class="modal fade" #loadalert id="loadalert" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true"
  data-bs-backdrop="static" data-bs-keyboard="false">

  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-title fs-13" id="exampleModalLabel1" [innerHTML]="popupTitle" style="display:none"></div>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"
          (click)="closealert()"></button>
      </div>
      <div class="modal-body">
        <p class="mod-clr1"> {{Usermessage}} </p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-primary bg-color border-0 br-30 fs-13 pad-2" data-dismiss="modal"
          href="javascript:void(0)" (click)="closealert()">OK</button>
      </div>
    </div>
  </div>
</div>
