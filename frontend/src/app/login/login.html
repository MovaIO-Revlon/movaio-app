<div class="bg-color w-100 h-100">

  <div class="row m-0 vh-100">
    <!-- Left Side: Image -->
    <!-- Left Side: Image1 -->
    <div class="col-md-6 p-0 bg-black">
      <img src="assets/img/login.png" class="img-fluid h-100 w-100 object-fit-cover" alt="login" />
    </div>

    <!-- Right Side: Login Form -->
    <!-- Right Side: Login Form1 -->
    <div class="col-md d-flex justify-content-center align-items-center bg-white">
      <div class="login-container">

        <!-- Logo -->
        <div *ngIf="!isNewPort" class="text-center mb-4">
          <img src="assets/img/header.svg" width="260" alt="Movate Logo" />
        </div>
        <div *ngIf="isNewPort" class="text-center mb-4">
          <img src="assets/img/header_newport.png" alt="Movate Logo" style="width: 350px;" />
        </div>

        <!-- Login Form -->
        <form #loginForm="ngForm" (ngSubmit)="LoginNavigate()" class="login-form">
          <div class="mb-3 position-relative">
            <i class="fa fa-user input-icon" aria-hidden="true"></i>
            <input class="form-control ps-5" type="text" name="email" autocomplete="off" ngModel required
              placeholder="Username" #username="ngModel" (ngModelChange)="username.control.setValue($event.trim(), {
    emitEvent: false,
    emitModelToViewChange: false
  })"/>
          </div>
          <div class="mb-3 position-relative">
            <i class="fa fa-lock input-icon" aria-hidden="true"></i>
            <input class="form-control ps-5" type="password" name="password" autocomplete="off" ngModel required
              placeholder="Password" #password="ngModel" (ngModelChange)="password.control.setValue($event.trim(), {
    emitEvent: false,
    emitModelToViewChange: false
  })" />
          </div>
          <div class="text-end mb-3">
            <button type="button" data-bs-toggle="modal" data-bs-target="#forgotPassword"
              class="forgot-password-button"> Forgot your password? </button>
          </div>
          <div *ngIf="!captcha && isNewPort" class="d-flex justify-content-center mb-4 recaptcha-zoom">
            <div #recaptchaElement></div>
          </div>
          <div *ngIf="captcha && !isNewPort" class="d-flex justify-content-center mb-4 recaptcha-zoom">
            <div #recaptchaElement></div>
          </div>
          <div *ngIf="loginErr !== ''" class="text-center text-danger mb-3">
            <span [textContent]="loginErr"></span>
          </div>
          <div class="text-center">
            <button type="submit" [disabled]="!isSignInEnabled()"
              class="btn btn-primary bt-bg-color px-5 py-2 border-0 br-30 fs-13 pt-2 pb-2">Login</button>
          </div>
        </form>
      </div>
    </div>
  </div>

</div>

<div class="modal fade" #forgotPassword id="forgotPassword" tabindex="-1" aria-labelledby="exampleModalLabel"
  aria-hidden="true">

  <div class="modal-dialog modal-dialog-centered" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-title fs-13"><strong> Forgot Password</strong></div>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"
          (click)="closeForgotEmail()"></button>
      </div>
      <div class="modal-body fs-13">
        Forgot your account’s password or having trouble logging into your account? Enter your email address, and we’ll
        send you a password.
        <div class="form-group pt-2">
          <label class="fs-13">Email </label>
          <input class="form-control br-30 br-clr1 fs-13" placeholder="Enter Your Email" id="myEmail"
            [(ngModel)]="myEmail" type="email" autocomplete="off" (input)="validateEmail()"
            (blur)="markEmailAsTouched()">
          <span id='message' class="mt-2 d-block fs-13" *ngIf="isEmailTouched && !isEmailValid"
            [ngStyle]="{ 'color': 'red' }">Not a valid email address</span>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-default fs-13 br-30 fs-13 pad-2" data-dismiss="modal"
          href="javascript:void(0)" (click)="closeForgotEmail()">Cancel</button>
        <button type="button" class="btn btn-primary bg-color border-0 br-30 fs-13 pt-2 pb-2 fs-13"
          [disabled]="!isEmailValid" href="javascript:void(0)" (click)="sendMail()">Send Recovery Email</button>
      </div>
    </div>

  </div>
</div>
