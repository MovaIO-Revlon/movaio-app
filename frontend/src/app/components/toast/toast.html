<!-- Success Toast -->
<div
  id="successToast"
  class="toast align-items-center text-white bg-success border-0 position-fixed top-0 end-0 m-4"
  role="alert"
  aria-live="assertive"
  aria-atomic="true"
  data-bs-delay="4000"
  style="z-index: 1060"
  data-bs-autohide="true"
>
  <div class="d-flex">
    <div class="toast-body">{{ toastMessage() }}</div>
    <button
      type="button"
      class="btn-close btn-close-white me-2 m-auto"
      data-bs-dismiss="toast"
      aria-label="Close"
    ></button>
  </div>
</div>

<!-- Error Toast -->
<div
  id="errorToast"
  class="toast align-items-center text-white bg-danger border-0 position-fixed top-0 end-0 m-4"
  role="alert"
  aria-live="assertive"
  aria-atomic="true"
  data-bs-delay="4000"
  style="z-index: 1060"
  data-bs-autohide="true"
>
  <div class="d-flex">
    <div class="toast-body">{{ toastMessage() }}</div>
    <button
      type="button"
      class="btn-close btn-close-white me-2 m-auto"
      data-bs-dismiss="toast"
      aria-label="Close"
    ></button>
  </div>
</div>
