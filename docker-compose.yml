services:
  # MongoDB service
  mongodb:
    image: mongo:latest
    container_name: mongodb
    restart: unless-stopped
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD}
    ports:
      - "27017:27017"
    networks:
      - opencon-network
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
      - ./mongo-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M




  # Application Frontend service
  appfrontend:
    build: ./frontend
    container_name: app-frontend
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl/fullchain.pem:/etc/ssl/certs/fullchain.pem:ro
      - ./ssl/private-key.pem:/etc/ssl/private/private-key.pem:ro
    networks:
      - opencon-network
    depends_on:
      - appbackend
      
 # Application Backend service
  appbackend:
    build: ./backend
    container_name: app-backend
    restart: unless-stopped
    environment:
      - MONGO_URI=mongodb://${MONGO_USERNAME}:${MONGO_USERNAME}@mongodb:27017/
    ports:
      - "5000:5000"
    networks:
      - opencon-network
    depends_on:
      - mongodb
      
         
volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local

networks:
  opencon-network:
    driver: bridge
