; iconfig.ini - settings for poller.py
; Relative paths are resolved against the folder containing this file.
; Do not put comments after a value on the same line.

[poller]
; Folder the poller watches. Drop ticket *.json files directly in here.
watch_dir = ./servicenow_tool_executor/ServiceNowstate

; Optional overrides. Default to sub-folders of watch_dir.
; They MUST be on the same drive/volume as watch_dir (files are claimed with an atomic rename).
; processing_dir = ./servicenow_tool_executor/ServiceNowstate/_processing
; processed_dir  = ./servicenow_tool_executor/ServiceNowstate/_processed
; failed_dir     = ./servicenow_tool_executor/ServiceNowstate/_failed

; Seconds between scans of watch_dir.
poll_interval_seconds = 5

; A file is only picked up once its size and modified-time have been unchanged
; for two consecutive scans AND it is at least this many seconds old.
settle_seconds = 3

; Number of files processed at the same time. Use 1 for strict one-at-a-time ordering.
max_workers = 4

file_pattern = *.json

; Extra attempts for transient ServiceNow/network errors (see poller.py for what counts as transient).
max_retries = 3
retry_backoff_seconds = 2

[logging]
level = INFO
; Leave empty to log to console only.
log_file = ./logs/poller.log
